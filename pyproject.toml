[build-system]
requires = ["setuptools>=62.0", "setuptools-git-versioning>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffpy.batchpdfsuite"
dynamic = ['version', 'dependencies']
authors = [
  {name='Yuchen Xiao', email='yx2924@columbia.edu'},
  {name='Simon Billinge', email='sbillinge@ucsb.edu'},
]
maintainers = [
  {name='Yuchen Xiao', email='yx2924@columbia.edu'},
  {name='Simon Billinge', email='sbillinge@ucsb.edu'},
]
description = "GUI for batch refinements of multiple PDF datasets"
keywords = ['diffraction', 'PDF', 'X-ray', 'neutron']
readme = "README.rst"
requires-python = ">=3.11, <3.14"
classifiers = [
        'Development Status :: 5 - Production/Stable',
        'Environment :: Console',
        'Intended Audience :: Developers',
        'Intended Audience :: Science/Research',
        'License :: OSI Approved :: BSD License',
        'Operating System :: MacOS :: MacOS X',
        'Operating System :: Microsoft :: Windows',
        'Operating System :: POSIX',
        'Operating System :: Unix',
        'Programming Language :: Python :: 3.11',
        'Programming Language :: Python :: 3.12',
        'Programming Language :: Python :: 3.13',
        'Topic :: Scientific/Engineering :: Physics',
        'Topic :: Scientific/Engineering :: Chemistry',
]

[project.urls]
Homepage = "https://github.com/diffpy/diffpy.batchpdfsuite/"
Issues = "https://github.com/diffpy/diffpy.batchpdfsuite/issues/"

[project.scripts]
bpdfsuite = "diffpy.batchpdfsuite.batchpdfsuite_app:main"

[tool.setuptools-git-versioning]
enabled = true
template = "{tag}"
dev_template = "{tag}"
dirty_template = "{tag}"

[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)
include = ["*"]  # package names should match these glob patterns (["*"] by default)
exclude = []  # exclude packages matching these glob patterns (empty by default)
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)

[tool.setuptools.dynamic]
dependencies = {file = ["requirements/pip.txt"]}

[tool.codespell]
exclude-file = ".codespell/ignore_lines.txt"
ignore-words = ".codespell/ignore_words.txt"
skip = "*.cif,*.dat"

[tool.docformatter]
recursive = true
wrap-summaries = 72
wrap-descriptions = 72

[tool.black]
line-length = 79
include = '\\.pyi?$'
exclude = '''
/(
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.rst
  | \.txt
  | _build
  | buck-out
  | build
  | dist

  # The following are specific to Black, you probably don't want those.
  | blib2to3
  | tests/data
)/
'''

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64"]
# platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.dependencies]
python = ">=3.11,<3.14"
pyface = "*"
traits = "*"
traitsui = "*"
pyqt = "*"
ipython = "*"
pyyaml = "*"
scipy = "*"
numpy = "*"
matplotlib = "*"
pandas = "*"
watchdog = "*"
jinja2 = "*"
textX = "*"
"diffpy.structure" = "*"
"diffpy.srfit" = "*"
"diffpy.srreal" = "*"
"diffpy.cmi" = "*"

[tool.pixi.pypi-dependencies]
chaco = "*"
"diffpy.apps" = { git = "https://github.com/diffpy/diffpy.apps", branch = "main" }
"diffpy.batchpdfsuite" = { git = "https://github.com/diffpy/diffpy.batchpdfsuite", branch = "main" }
#"diffpy.batchpdfsuite" = { path = ".", editable = true }

[tool.pixi.tasks]
# Launch the GUI directly from the source tree.
# gui = "PYTHONPATH=src python -m diffpy.batchpdfsuite.batchpdfsuite_app"
gui = { cmd = "python -m diffpy.batchpdfsuite.batchpdfsuite_app", env = { PYTHONPATH = "src" } }
# gui = "python -m diffpy.batchpdfsuite.batchpdfsuite_app"

[tool.pixi.environments]
#terminal = { features = ["profile", "terminal"], solve-group = "profile" }
terminal = { features = [], solve-group = "default" }
